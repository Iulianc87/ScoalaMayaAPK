name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          # Dăm permisiuni de scriere/citire peste tot
          chmod -R 777 .
          
          # Instalăm dependințele
          pip install --upgrade pip
          pip install setuptools
          
          # Rulăm buildozer
          # -v înseamnă verbose (ne dă toate detaliile)
          buildozer -v android debug
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: scoalamaya-apk
          path: bin/*.apk

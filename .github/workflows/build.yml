name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          # Ignorăm verificarea de root complet
          export BUILDOZER_ALLOW_ROOT=1
          
          # Instalăm/actualizăm ce e strict necesar
          pip install --upgrade pip
          pip install setuptools
          
          # Rulăm buildozer direct
          # Comanda 'yes y' răspunde automat la orice întrebare (inclusiv cea de root)
          yes y | buildozer -v android debug
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: scoalamaya-apk
          path: bin/*.apk

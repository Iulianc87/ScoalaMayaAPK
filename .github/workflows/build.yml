name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      # Eliminăm 'options: --user root' pentru a rula ca user standard
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: |
          # Dăm permisiuni pentru folderul de lucru
          chown -R user:user .
          
          # Instalăm dependințele
          pip install --upgrade pip
          
          # Rulăm buildozer cu variabilele de mediu care ignoră avertismentul de root 
          # și forțăm acceptarea prin 'yes'
          export BUILDOZER_ALLOW_ROOT=1
          yes y | buildozer -v android debug
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: scoalamaya-apk
          path: bin/*.apk

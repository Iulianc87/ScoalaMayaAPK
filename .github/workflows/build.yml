name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache libsqlite3-dev
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install buildozer==1.5.0
          pip install --upgrade https://github.com/kivy/python-for-android/archive/master.zip

      - name: Build
        run: |
          # Se accepta licentele automat prin input-ul de mai jos
          yes | buildozer android debug
        
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: scoalamaya-apk
          path: bin/*.apk

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            wget \
            tar

          python -m pip install --upgrade pip

          pip install cython==0.29.36
          pip install buildozer==1.5.0
          pip install virtualenv

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk.zip

          unzip -o sdk.zip

          mkdir temp
          mv cmdline-tools/* temp/

          mkdir -p cmdline-tools/latest
          mv temp/* cmdline-tools/latest/

          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Create buildozer.spec
        run: |
          cd Proiect

          cat > buildozer.spec << 'EOF'
[app]

title = ScoalaMaya
package.name = scoalamaya
package.domain = org.scoala

source.dir = .
source.include_exts = py,png,jpg,kv,atlas,ttf

version = 1.0

requirements = python3,kivy==2.2.1

orientation = portrait

fullscreen = 0

[buildozer]

log_level = 2

warn_on_root = 1

[app:android]

android.api = 34
android.minapi = 24
android.ndk = 25b
android.accept_sdk_license = True
android.skip_update = True
android.sdk_path = /home/runner/android-sdk
EOF

      - name: Build APK
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          cd Proiect

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Proiect/bin/*.apk

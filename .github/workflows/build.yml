name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install cython==0.29.33
          pip install buildozer==1.5.0
          pip install python-for-android==2024.01.21

      - name: Build APK
        run: |
          cd Proiect

          rm -rf .buildozer
          rm -f buildozer.spec

          buildozer init

          sed -i 's#title = My Application#title = ScoalaMaya#' buildozer.spec
          sed -i 's#package.name = myapp#package.name = scoalamaya#' buildozer.spec
          sed -i 's#package.domain = org.test#package.domain = org.scoala#' buildozer.spec

          sed -i 's#source.include_exts = py,png,jpg,kv,atlas#source.include_exts = py,png,jpg,kv,atlas,ttf,json#' buildozer.spec

          sed -i 's#requirements = python3,kivy#requirements = python3,kivy==2.2.1#' buildozer.spec

          echo "" >> buildozer.spec
          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec
          echo "android.archs = armeabi-v7a" >> buildozer.spec

          export P4A_BRANCH=2024.01.21

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Proiect/bin/*.apk

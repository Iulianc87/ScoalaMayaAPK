name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            wget \
            tar

          python -m pip install --upgrade pip

          pip install cython==0.29.36
          pip install buildozer==1.5.0
          pip install virtualenv

      - name: Install Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O sdk.zip

          unzip -o sdk.zip

          mkdir temp
          mv cmdline-tools/* temp/

          mkdir -p cmdline-tools/latest
          mv temp/* cmdline-tools/latest/

          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build APK
        run: |
          export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          cd Proiect

          buildozer init || true

          sed -i 's/# android.api = 31/android.api = 34/' buildozer.spec
          sed -i 's/# android.minapi = 21/android.minapi = 24/' buildozer.spec
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

          echo "android.sdk = 34" >> buildozer.spec
          echo "android.sdk_path = /home/runner/android-sdk" >> buildozer.spec
          echo "android.skip_update = True" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Proiect/bin/*.apk

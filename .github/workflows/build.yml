name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            zip unzip git wget \
            openjdk-17-jdk \
            python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

          pip install --upgrade pip
          pip install cython==0.29.33
          pip install buildozer

      - name: Accept Android licenses
        run: |
          export PATH=$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools" || true
          sdkmanager "platforms;android-33" || true
          sdkmanager "build-tools;34.0.0" || true

      - name: Build APK
        run: |
          cd Proiect

          buildozer init

          sed -i 's/# log_level = 2/log_level = 2/' buildozer.spec
          sed -i 's/title = My Application/title = ScoalaMaya/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = scoalamaya/' buildozer.spec
          sed -i 's/package.domain = org.test/package.domain = org.scoala/' buildozer.spec
          sed -i 's/source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,ttf/' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.2.1/' buildozer.spec

          echo "android.api = 33" >> buildozer.spec
          echo "android.minapi = 24" >> buildozer.spec
          echo "android.sdk = 33" >> buildozer.spec
          echo "android.ndk = 25b" >> buildozer.spec
          echo "android.build_tools_version = 34.0.0" >> buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec
          echo "android.skip_update = True" >> buildozer.spec
          echo "android.archs = armeabi-v7a" >> buildozer.spec

          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Proiect/bin/*.apk
